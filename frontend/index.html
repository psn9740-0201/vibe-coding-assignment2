<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>세상너무빨리변하는기술소식</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <canvas id="season-fx" class="season-fx" aria-hidden="true"></canvas>
    <div class="container header-inner">
      <div class="brand">
        <div class="mascot">
          <span id="mascot-bubble" class="mascot-bubble" aria-hidden="true"></span>
          <!-- 계절별 마스코트: 빈티지 수채화풍 코기 (직접 그린 SVG). 헤더의 data-season 값에 맞는 그림만 보인다 -->
          <svg class="mascot-defs" width="0" height="0" aria-hidden="true">
            <defs>
              <!-- 종이 질감 -->
              <filter id="vt-paper" x="0" y="0" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="7" />
                <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.34  0 0 0 0 0.2  0.6 0 0 0 -0.18" />
              </filter>
              <!-- 손그림처럼 살짝 흔들리는 선 -->
              <filter id="vt-ink" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3" result="n" />
                <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" />
              </filter>
              <radialGradient id="vt-vignette" cx="50%" cy="50%" r="65%">
                <stop offset="0.6" stop-color="#7a5a32" stop-opacity="0" />
                <stop offset="1" stop-color="#7a5a32" stop-opacity="0.3" />
              </radialGradient>
              <clipPath id="vt-clip"><rect width="80" height="80" rx="10" /></clipPath>
              <!-- 앉아 있는 코기 -->
              <symbol id="vt-corgi" viewBox="0 0 80 80">
                <g stroke="#5b4636" stroke-width="0.8" stroke-linejoin="round">
                  <path d="M28 44 Q23 62 28 71 L52 71 Q57 62 52 44 Z" fill="#cf8a50" />
                  <path d="M33 44 Q40 52 47 44 Q48.5 58 40 67 Q31.5 58 33 44 Z" fill="#fbf5ea" stroke="none" />
                  <ellipse cx="35" cy="71" rx="4.2" ry="2.4" fill="#fbf5ea" />
                  <ellipse cx="45" cy="71" rx="4.2" ry="2.4" fill="#fbf5ea" />
                  <path d="M29 31 L26.5 14.5 L37.5 24.5 Z" fill="#cf8a50" />
                  <path d="M51 31 L53.5 14.5 L42.5 24.5 Z" fill="#cf8a50" />
                  <path d="M29.8 27 L28.4 18 L34.5 24 Z" fill="#e8b4a0" stroke="none" />
                  <path d="M50.2 27 L51.6 18 L45.5 24 Z" fill="#e8b4a0" stroke="none" />
                  <ellipse cx="40" cy="33" rx="13" ry="11" fill="#cf8a50" />
                </g>
                <path d="M40 22.5 Q37.5 29 33.5 37.5 Q40 44 46.5 37.5 Q42.5 29 40 22.5 Z" fill="#fbf5ea" />
                <ellipse cx="40" cy="38.5" rx="7" ry="4.8" fill="#fbf5ea" />
                <ellipse cx="40" cy="35.6" rx="2.1" ry="1.5" fill="#3b2a20" />
                <circle cx="34.5" cy="30.5" r="1.5" fill="#3b2a20" />
                <circle cx="45.5" cy="30.5" r="1.5" fill="#3b2a20" />
                <circle cx="35" cy="30" r="0.45" fill="#fff" />
                <circle cx="46" cy="30" r="0.45" fill="#fff" />
                <circle cx="31.5" cy="35.5" r="2" fill="#e39a8a" opacity="0.5" />
                <circle cx="48.5" cy="35.5" r="2" fill="#e39a8a" opacity="0.5" />
                <path d="M37.8 38.4 Q40 40.2 42.2 38.4" stroke="#3b2a20" stroke-width="0.8" fill="none" stroke-linecap="round" />
              </symbol>
              <!-- 오래된 판화 같은 이중 테두리 + 종이 -->
              <g id="vt-paper-bg">
                <rect width="80" height="80" fill="#f3e8d0" />
                <rect width="80" height="80" filter="url(#vt-paper)" />
              </g>
              <g id="vt-frame">
                <rect width="80" height="80" fill="url(#vt-vignette)" />
                <rect x="3" y="3" width="74" height="74" rx="7" fill="none" stroke="#6b5440" stroke-width="0.7" />
                <rect x="5" y="5" width="70" height="70" rx="5" fill="none" stroke="#6b5440" stroke-width="0.3" />
              </g>
            </defs>
          </svg>

          <svg class="mascot-art" data-season="winter" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="빨간 목도리를 한 코기와 눈 덮인 전나무">
            <g clip-path="url(#vt-clip)">
              <use href="#vt-paper-bg" />
              <g filter="url(#vt-ink)">
                <rect x="4" y="4" width="72" height="52" fill="#b9c8cf" opacity="0.55" />
                <path d="M4 60 Q24 52 44 58 T76 56 V76 H4 Z" fill="#fbf8f2" stroke="#8a7a68" stroke-width="0.5" />
                <path d="M15 22 L7 40 H23 Z M15 32 L5 52 H25 Z" fill="#5f7556" stroke="#4a5a40" stroke-width="0.6" />
                <path d="M15 22 L11 31 Q15 29 19 31 Z M15 33 L9 44 Q15 41 21 44 Z" fill="#fbf8f2" />
                <rect x="13.6" y="52" width="2.8" height="5" fill="#7a5a3c" />
                <g class="mascot-figure">
                  <use href="#vt-corgi" width="80" height="80" />
                  <path d="M28.5 43 Q40 48.5 51.5 43 L51 47.5 Q40 52 29 47.5 Z" fill="#a8423a" stroke="#5b4636" stroke-width="0.6" />
                  <path d="M45 47 L48.5 57 L44.5 57.5 L42 48.5 Z" fill="#a8423a" stroke="#5b4636" stroke-width="0.6" />
                </g>
                <g fill="#fff">
                  <circle cx="60" cy="12" r="1.3" /><circle cx="68" cy="24" r="1" /><circle cx="27" cy="9" r="1" />
                  <circle cx="64" cy="40" r="1.2" /><circle cx="8" cy="14" r="0.9" />
                </g>
              </g>
              <use href="#vt-frame" />
            </g>
          </svg>

          <svg class="mascot-art" data-season="spring" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="튤립 정원에 앉은 코기">
            <g clip-path="url(#vt-clip)">
              <use href="#vt-paper-bg" />
              <g filter="url(#vt-ink)">
                <rect x="4" y="4" width="72" height="50" fill="#dfe6d0" opacity="0.6" />
                <path d="M4 60 Q30 54 50 59 T76 57 V76 H4 Z" fill="#b3c28a" opacity="0.85" stroke="#7d8a5c" stroke-width="0.5" />
                <g stroke="#6f8a4c" stroke-width="1" fill="none">
                  <path d="M12 72 V50" /><path d="M19 73 V56" /><path d="M62 73 V52" /><path d="M69 72 V58" />
                </g>
                <g stroke="#5b4636" stroke-width="0.5">
                  <path d="M8.5 50 Q8 43 12 42 Q16 43 15.5 50 Q12 52 8.5 50 Z" fill="#d98a8f" />
                  <path d="M16 56 Q15.5 50 19 49 Q22.5 50 22 56 Q19 58 16 56 Z" fill="#e6c26e" />
                  <path d="M58.5 52 Q58 45 62 44 Q66 45 65.5 52 Q62 54 58.5 52 Z" fill="#e6c26e" />
                  <path d="M66 58 Q65.5 52 69 51 Q72.5 52 72 58 Q69 60 66 58 Z" fill="#d98a8f" />
                </g>
                <g class="mascot-figure">
                  <use href="#vt-corgi" width="80" height="80" />
                  <g fill="#efc6c4" stroke="#b5656b" stroke-width="0.4">
                    <circle cx="51" cy="17" r="2" /><circle cx="54" cy="19.5" r="2" /><circle cx="50.5" cy="21" r="2" />
                  </g>
                  <circle cx="52" cy="19.2" r="1" fill="#e6c26e" />
                </g>
                <g fill="#efc6c4">
                  <ellipse cx="26" cy="12" rx="2" ry="1.2" transform="rotate(-30 26 12)" />
                  <ellipse cx="62" cy="14" rx="2" ry="1.2" transform="rotate(20 62 14)" />
                  <ellipse cx="68" cy="33" rx="1.7" ry="1" transform="rotate(-10 68 33)" />
                </g>
              </g>
              <use href="#vt-frame" />
            </g>
          </svg>

          <svg class="mascot-art" data-season="summer" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="밀짚모자를 쓴 코기와 데이지 들판">
            <g clip-path="url(#vt-clip)">
              <use href="#vt-paper-bg" />
              <g filter="url(#vt-ink)">
                <rect x="4" y="4" width="72" height="50" fill="#e9d9a6" opacity="0.55" />
                <circle cx="64" cy="15" r="6" fill="#e8b85c" opacity="0.7" />
                <path d="M4 58 Q26 52 46 57 T76 55 V76 H4 Z" fill="#a9b97a" opacity="0.9" stroke="#7d8a5c" stroke-width="0.5" />
                <g class="mascot-figure">
                  <use href="#vt-corgi" width="80" height="80" />
                  <ellipse cx="40" cy="22.5" rx="12.5" ry="3" fill="#dcb56c" stroke="#5b4636" stroke-width="0.6" />
                  <path d="M33 22.5 Q33 14.5 40 14.5 Q47 14.5 47 22.5 Z" fill="#dcb56c" stroke="#5b4636" stroke-width="0.6" />
                  <path d="M33.2 20 Q40 21.5 46.8 20 L46.9 22 Q40 23.5 33.1 22 Z" fill="#7b8fa6" />
                </g>
                <g stroke="#5b4636" stroke-width="0.3">
                  <g fill="#fbf8f2">
                    <circle cx="11" cy="64" r="1.6" /><circle cx="14" cy="62" r="1.6" /><circle cx="14.5" cy="65.5" r="1.6" /><circle cx="10.5" cy="67" r="1.6" />
                    <circle cx="66" cy="65" r="1.6" /><circle cx="69" cy="63" r="1.6" /><circle cx="69.5" cy="66.5" r="1.6" /><circle cx="65.5" cy="68" r="1.6" />
                  </g>
                  <circle cx="12.5" cy="64.8" r="1.2" fill="#e6b84a" />
                  <circle cx="67.5" cy="65.8" r="1.2" fill="#e6b84a" />
                </g>
              </g>
              <use href="#vt-frame" />
            </g>
          </svg>

          <svg class="mascot-art" data-season="autumn" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="호박 옆에 앉은 코기와 낙엽">
            <g clip-path="url(#vt-clip)">
              <use href="#vt-paper-bg" />
              <g filter="url(#vt-ink)">
                <rect x="4" y="4" width="72" height="50" fill="#e8c79a" opacity="0.5" />
                <path d="M4 60 Q28 53 48 58 T76 56 V76 H4 Z" fill="#c9a26a" opacity="0.8" stroke="#8a6a44" stroke-width="0.5" />
                <g class="mascot-figure">
                  <use href="#vt-corgi" width="80" height="80" />
                </g>
                <g stroke="#5b4636" stroke-width="0.6">
                  <ellipse cx="64" cy="66" rx="9" ry="6.5" fill="#c7702f" />
                  <path d="M64 59.5 Q60 66 64 72.5 M64 59.5 Q68 66 64 72.5" fill="none" stroke-width="0.5" />
                  <path d="M63.5 60 Q63 56 65.5 55" fill="none" stroke="#5f7556" stroke-width="1.4" stroke-linecap="round" />
                </g>
                <g stroke="#5b4636" stroke-width="0.3">
                  <path d="M12 12 Q17 16 13 21 Q8 17 12 12 Z" fill="#a4472f" transform="rotate(30 12 16)" />
                  <path d="M66 26 Q71 30 67 35 Q62 31 66 26 Z" fill="#d4a24c" transform="rotate(-25 66 30)" />
                  <path d="M14 66 Q19 69 15 73 Q10 70 14 66 Z" fill="#c0703a" transform="rotate(70 14 69)" />
                  <path d="M22 70 Q26 72 23 75 Q19 73 22 70 Z" fill="#8a5a2b" transform="rotate(-40 22 72)" />
                </g>
              </g>
              <use href="#vt-frame" />
            </g>
          </svg>
        </div>
        <div>
          <h1>세상너무빨리변하는기술소식</h1>
          <p class="subtitle">AI · 반도체 · 클라우드 · 사이버보안 · 통신 · 플랫폼 &nbsp;|&nbsp; 과기정통부 · 산업부 · 행안부</p>
        </div>
      </div>
      <div class="header-actions">
        <label class="date-picker">
          <span>기준일</span>
          <input id="date-input" type="date" />
        </label>
        <span id="updated-at" class="updated-at">불러오는 중…</span>
        <button id="refresh-btn" class="refresh-btn" type="button">새로고침</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 메인 배너: 오늘의 IT 업계 브리핑 (3줄) -->
    <section class="banner" aria-labelledby="banner-title">
      <div class="banner-head">
        <h2 id="banner-title">오늘의 IT 업계 브리핑</h2>
        <span id="banner-date" class="banner-date"></span>
        <span id="banner-mode" class="banner-mode"></span>
      </div>
      <ol id="banner-lines" class="banner-lines">
        <li class="loading">브리핑을 작성하는 중…</li>
      </ol>
      <p id="banner-note" class="banner-note"></p>
    </section>

    <!-- IT 주요 뉴스 (5~10건) -->
    <section class="section">
      <div class="section-head">
        <h2>IT 주요 뉴스</h2>
        <span id="news-count" class="count"></span>
      </div>
      <nav id="filters" class="filters" aria-label="분야 필터">
        <button class="chip active" data-filter="전체">전체</button>
        <button class="chip" data-filter="AI" data-label="AI">AI</button>
        <button class="chip" data-filter="반도체" data-label="반도체">반도체</button>
        <button class="chip" data-filter="클라우드" data-label="클라우드">클라우드</button>
        <button class="chip" data-filter="사이버보안" data-label="사이버보안">사이버보안</button>
        <button class="chip" data-filter="통신" data-label="통신">통신</button>
        <button class="chip" data-filter="플랫폼" data-label="플랫폼">플랫폼</button>
      </nav>
      <div id="news-list" class="card-list"></div>
    </section>

    <!-- 정부 정책 변경 (1~3건) -->
    <section class="section">
      <div class="section-head">
        <h2>정부 정책 변경</h2>
        <span id="policy-count" class="count"></span>
      </div>
      <div id="policy-list" class="card-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="sources">출처: -</p>
      <p>헤드라인을 클릭하면 원문 기사로 이동합니다. 업계 영향은 키워드 규칙에 따라 자동 생성되므로 참고용입니다.</p>
    </div>
  </footer>

  <!-- 카드 템플릿: app.js 에서 복사해서 사용 -->
  <template id="card-template">
    <article class="card">
      <div class="card-meta">
        <span class="badge"></span>
        <span class="source"></span>
        <span class="date"></span>
      </div>
      <h3 class="card-title"><a target="_blank" rel="noopener noreferrer" title="원문 기사 새 창으로 열기"></a></h3>
      <div class="impact">
        <strong>업계 영향</strong>
        <p></p>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
